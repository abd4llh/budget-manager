plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseKeystore = System.getenv('BUDGET_ANDROID_KEYSTORE')
def releaseKeyAlias = System.getenv('BUDGET_ANDROID_KEY_ALIAS')
def releaseStorePassword = System.getenv('BUDGET_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('BUDGET_ANDROID_KEY_PASSWORD')

android {
    namespace 'net.budgetmanager.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'net.budgetmanager.mobile'
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName '0.9.0-beta'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
